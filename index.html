<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#111318" />
  <title>BoxLab v0.6.2</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><strong>BoxLab</strong><span>v0.6.2</span></div>
      <div class="segmented" id="selectionModes" aria-label="Selection mode">
        <button data-mode="vertex">Vertex</button>
        <button data-mode="edge">Edge</button>
        <button data-mode="face" class="active">Face</button>
      </div>
      <div class="top-actions">
        <button id="undoBtn">Undo</button><button id="redoBtn">Redo</button><button id="resetBtn">Reset</button>
      </div>
    </header>
    <main id="viewportWrap">
      <canvas id="viewport"></canvas>
      <div class="hint">Tap to select. Drag selected item to edit. After Loop Cut, drag the new loop directly or use Slide. 2-finger tap Undo • 3-finger tap Redo.</div>
      <section class="floating-panel left-panel">
        <div class="panel-title">Transform</div>
        <div class="segmented vertical" id="toolModes">
          <button data-tool="move" class="active">Move</button>
          <button data-tool="scale">Scale</button>
          <button data-tool="extrude">Extrude</button>
        </div>
        <div class="panel-title edge-title">Edge</div>
        <button id="loopCutBtn" class="primary">Loop Cut 50%</button>
        <label class="range-row"><span>Slide</span><input id="loopSlide" type="range" min="5" max="95" value="50" step="1" disabled /><output id="loopSlideOut">50%</output></label>
        <label class="range-row"><span>Crease</span><input id="creaseStrength" type="range" min="0" max="100" value="100" step="5" /><output id="creaseStrengthOut">100%</output></label>
        <button id="applyCreaseBtn">Apply Crease</button>
        <button id="clearCreaseBtn">Clear Crease</button>
        <div class="panel-title face-title">Face</div>
        <button id="extrudeBtn" class="primary">Extrude +0.25</button>
        <button id="insetBtn">Inset 20%</button>
        <button id="deleteFaceBtn" class="danger">Delete Face</button>
      </section>
      <section class="floating-panel right-panel">
        <div class="panel-title">Mirror</div>
        <label class="toggle-row"><input data-mirror-axis="x" type="checkbox" /><span>Mirror X</span></label>
        <label class="toggle-row"><input data-mirror-axis="y" type="checkbox" /><span>Mirror Y</span></label>
        <label class="toggle-row"><input data-mirror-axis="z" type="checkbox" /><span>Mirror Z</span></label>
        <hr />
        <div class="panel-title">Subdivision</div>
        <label class="toggle-row"><input id="subdToggle" type="checkbox" /><span>SubD Preview</span></label>
        <label class="toggle-row"><input id="cageToggle" type="checkbox" checked /><span>Show Cage</span></label>
        <label class="range-row"><span>Level</span><input id="subdLevel" type="range" min="1" max="3" value="1" step="1" /><output id="subdLevelOut">1</output></label>
        <hr />
        <button id="exportBaseBtn">Export Base OBJ</button>
        <button id="exportSubdBtn">Export SubD OBJ</button>
      </section>
      <footer class="statusbar"><span id="meshStats">8 verts • 6 faces</span><span id="selectionStatus">Face mode • nothing selected</span></footer>
    </main>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
