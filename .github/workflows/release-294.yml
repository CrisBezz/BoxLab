name: Release BoxLab 294
on:
  push:
    paths:
      - '.github/workflows/release-294.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Verify vertex selection fix
        run: |
          grep -q "always-additive component selection" src/vertex-pick-assist.js
          ! grep -q "multiToggle" src/vertex-pick-assist.js
          grep -q 'vertex-pick-assist.js?v=0.36.18.294' index.html
          grep -q 'styles.css?v=0.36.18.270' index.html
          test "$(git hash-object src/multi-object-transform.js)" = "0b6f676900bf9a3787cf420e276bbb0f57ac46ff"
      - name: Package 294
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          s=re.sub(r'BoxLab v0\.36\.18\.\d+','BoxLab v0.36.18.294',s,count=1)
          s=re.sub(r'(<span id="appVersion">v0\.36\.18\.)\d+(</span>)',r'\g<1>294\2',s,count=1)
          s=re.sub(r'(src="./src/loose-bootstrap\.js\?v=0\.36\.18\.)\d+(")',r'\g<1>294\2',s,count=1)
          s=re.sub(r'(href="./styles\.css\?v=0\.36\.18\.)\d+(")',r'\g<1>270\2',s,count=1)
          p.write_text(s)
          Path('version.json').write_text('{"version":"0.36.18.294"}\n')
          PY
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.json
          git commit -m 'Release BoxLab v0.36.18.294 vertex multi-selection fix'
          git push
