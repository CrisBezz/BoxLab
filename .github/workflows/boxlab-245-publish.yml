name: Publish BoxLab 245

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boxlab-245-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache-hop live runtime to 245
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          replacements={
            '<title>BoxLab v0.36.18.244</title>':'<title>BoxLab v0.36.18.245</title>',
            '<span id="appVersion">v0.36.18.244</span>':'<span id="appVersion">v0.36.18.245</span>',
            './src/loose-bootstrap.js?v=0.36.18.244':'./src/loose-bootstrap.js?v=0.36.18.245',
          }
          for old,new in replacements.items():
            if old not in s: raise SystemExit(f'marker missing: {old}')
            s=s.replace(old,new,1)
          p.write_text(s)
          Path('version.json').write_text('{"version":"0.36.18.245"}\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.json
          git commit -m 'Release BoxLab v0.36.18.245 perimeter-aware Bridge'
          git push
