name: BoxLab 242 cavity-aware Through
on:
  push:
    paths:
      - '.github/workflows/boxlab-242-cavity-through.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 242 cavity-aware Through targets
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/through-kernel.js')
          s=p.read_text()
          s=s.replace('// Through v0.36.16.0: geometric prism subtraction. No UI or mesh prototype hooks.','// Through v0.36.18.242: cavity-aware ordered Through targets. No UI or mesh prototype hooks.',1)
          old="""  hits.sort((a,b)=>a.min-b.min);const first=hits[0].min;
  // v241: existing tunnels can legitimately create several shell crossings along the same inward prism.
  // Promote the gesture to Through and use the farthest valid exit depth.
  const endDepth=Math.max(...hits.map(h=>h.max));
  return {source,n,dir,sides,start,eps,ts:ts.map(t=>t.p),first,depth:endDepth,fi,multiExit:hits.length>1};
"""
          new="""  hits.sort((a,b)=>a.min-b.min);
  // v242: keep each distinct SOLID→VOID exit band as an ordered Through target.
  // Triangles belonging to the same physical shell are merged by overlapping depth range.
  const targets=[];
  for(const h of hits){
    const last=targets.at(-1);
    if(last&&h.min<=last.depth+eps*8){last.first=Math.min(last.first,h.min);last.depth=Math.max(last.depth,h.max);}
    else targets.push({first:h.min,depth:h.max});
  }
  const first=targets[0].first,endDepth=targets.at(-1).depth;
  return {source,n,dir,sides,start,eps,ts:ts.map(t=>t.p),first,depth:endDepth,targets,fi,multiExit:targets.length>1};
"""
          if old not in s: raise SystemExit('242 context marker not found')
          s=s.replace(old,new,1)
          old="export function planThrough(m,fi) {try {const c=context(m,fi);return {ok:true,sourceFaceIndex:fi,distance:-c.depth,firstDistance:-c.first};}catch(e){return{ok:false,reason:e.message};}}"
          new="export function planThrough(m,fi) {try {const c=context(m,fi);return {ok:true,sourceFaceIndex:fi,distance:-c.depth,firstDistance:-c.first,targets:c.targets.map(t=>({...t}))};}catch(e){return{ok:false,reason:e.message};}}"
          if old not in s: raise SystemExit('242 plan marker not found')
          s=s.replace(old,new,1)
          old="const c=context(before,plan.sourceFaceIndex),{source,dir,n,sides,start,eps,ts,depth}=c;"
          new="const c=context(before,plan.sourceFaceIndex),{source,dir,n,sides,start,eps,ts}=c,depth=Number.isFinite(plan?.targetDepth)?Math.min(c.depth,Math.max(c.first,plan.targetDepth)):c.depth;"
          if old not in s: raise SystemExit('242 build marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('src/multi-face-direct.js')
          s=p.read_text()
          s=s.replace("./through-kernel.js?v=0.36.18.241","./through-kernel.js?v=0.36.18.242",1)
          s=s.replace("./topology-seam-conformance.js?v=0.36.18.241","./topology-seam-conformance.js?v=0.36.18.242",1)
          old="""  const p=prepared||planThrough(m,sourceFaceIndex);
  if(p.ok&&distance<=p.distance+1e-6)return{mode:'through',throughPlan:p,shellHit:null};
  if(p.ok&&distance<=p.firstDistance+1e-6)return{mode:'blocked',throughPlan:null,shellHit:{distance:-p.firstDistance},reason:'partial-exit-sweep'};
  if(p.ok)return{mode:'extrude',throughPlan:null,shellHit:null};
"""
          new="""  const p=prepared||planThrough(m,sourceFaceIndex);
  if(p.ok){
    const travel=-distance,targets=(p.targets?.length?p.targets:[{first:-p.firstDistance,depth:-p.distance}]).slice().sort((a,b)=>a.depth-b.depth);
    const reached=targets.filter(t=>travel>=t.depth-1e-6);
    if(reached.length){const target=reached.at(-1);return{mode:'through',throughPlan:{...p,targetDepth:target.depth,distance:-target.depth,firstDistance:-target.first},shellHit:null};}
    const partial=targets.find(t=>travel>=t.first-1e-6&&travel<t.depth-1e-6);
    if(partial)return{mode:'blocked',throughPlan:null,shellHit:{distance:partial.first},reason:'partial-exit-sweep'};
    return{mode:'extrude',throughPlan:null,shellHit:null};
  }
"""
          if old not in s: raise SystemExit('242 classify marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('src/direct-topology-conformance-guard.js')
          s=p.read_text().replace("const VERSION='0.36.18.241';","const VERSION='0.36.18.242';")
          p.write_text(s)
          p=Path('src/release-version.js')
          s=p.read_text().replace("const VERSION='0.36.18.241';","const VERSION='0.36.18.242';")
          p.write_text(s)
          Path('version.json').write_text('{"version":"0.36.18.242"}\n')

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('BoxLab v0.36.18.241','BoxLab v0.36.18.242')
          s=s.replace('./src/multi-face-direct.js?v=0.36.18.241','./src/multi-face-direct.js?v=0.36.18.242')
          s=s.replace('./src/direct-topology-conformance-guard.js?v=0.36.18.241','./src/direct-topology-conformance-guard.js?v=0.36.18.242')
          s=s.replace('./src/release-version.js?v=0.36.18.241','./src/release-version.js?v=0.36.18.242')
          p.write_text(s)
          PY
      - name: Commit 242
        run: |
          git config user.name 'Bezzo'
          git config user.email '115067958+CrisBezz@users.noreply.github.com'
          git add src/through-kernel.js src/multi-face-direct.js src/direct-topology-conformance-guard.js src/release-version.js version.json index.html
          git commit -m 'BoxLab 0.36.18.242 cavity-aware Through targets'
          git push