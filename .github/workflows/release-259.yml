name: Release 0.36.18.259

on:
  push:
    paths:
      - '.github/workflows/release-259.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Make live Object toolbar singleton
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/object-management.js')
          s=p.read_text()
          old="let selectedIds=new Set(),multiEnabled=false,internalAction=false,toolbar=null,multiButton=null,allButton=null,visibilityButton=null,lockButton=null,clearButton=null,countLabel=null;"
          new="let selectedIds=new Set(),multiEnabled=false,internalAction=false,toolbar=null,multiButton=null,allButton=null,visibilityButton=null,lockButton=null,clearButton=null,countLabel=null;const toolbarOwner=`object-management-${Date.now()}-${Math.random()}`;"
          if old not in s: raise SystemExit('state marker missing')
          s=s.replace(old,new,1)
          old2="toolbar=document.createElement('div');toolbar.className='object-management-tools';toolbar.id='objectManagementTools';"
          new2="toolbar=document.createElement('div');toolbar.className='object-management-tools';toolbar.id='objectManagementTools';toolbar.dataset.objectToolbarOwner=toolbarOwner;globalThis.__boxlabObjectToolbarOwner=toolbarOwner;"
          if old2 not in s: raise SystemExit('toolbar marker missing')
          s=s.replace(old2,new2,1)
          old3="countLabel=document.createElement('div');countLabel.className='object-management-count';toolbar.append(multiButton,allButton,visibilityButton,lockButton,clearButton,countLabel);const selectionHost=document.querySelector('#selectionDrawer');(selectionHost||drawer).appendChild(toolbar);"
          new3="countLabel=document.createElement('div');countLabel.className='object-management-count';toolbar.append(multiButton,allButton,visibilityButton,lockButton,clearButton,countLabel);const selectionHost=document.querySelector('#selectionDrawer');const prune=()=>{if(globalThis.__boxlabObjectToolbarOwner!==toolbarOwner)return;for(const candidate of document.querySelectorAll('#selectionDrawer #objectManagementTools,#selectionDrawer .object-management-tools'))if(candidate!==toolbar)candidate.remove();};prune();(selectionHost||drawer).appendChild(toolbar);prune();[0,50,150,400,900].forEach(delay=>setTimeout(prune,delay));"
          if old3 not in s: raise SystemExit('append marker missing')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          PY
      - name: Update layout version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/object-selection-layout.js'); s=p.read_text(); s=s.replace('0.36.18.258','0.36.18.259'); p.write_text(s)
          PY
      - name: Add singleton toolbar regression
        run: |
          cat > tests/object-selection-singleton-contract.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const source=readFileSync(new URL('../src/object-management.js',import.meta.url),'utf8');
          test('Object selection toolbar has a single authoritative live owner',()=>{
            assert.match(source,/toolbarOwner=`object-management-/);
            assert.match(source,/__boxlabObjectToolbarOwner=toolbarOwner/);
            assert.match(source,/candidate!==toolbar\)candidate\.remove\(\)/);
            assert.match(source,/\[0,50,150,400,900\]\.forEach/);
          });
          EOF
      - run: npm test
      - name: Package 0.36.18.259
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          s=re.sub(r'<title>BoxLab v[^<]+</title>','<title>BoxLab v0.36.18.259</title>',s,1)
          s=re.sub(r'<span id="appVersion">v[^<]+</span>','<span id="appVersion">v0.36.18.259</span>',s,1)
          s=re.sub(r'object-management\.js\?v=[^"<]+','object-management.js?v=0.36.18.259',s,1)
          s=re.sub(r'object-selection-layout\.js\?v=[^"<]+','object-selection-layout.js?v=0.36.18.259',s,1)
          p.write_text(s)
          Path('version.json').write_text('{"version":"0.36.18.259"}\n')
          PY
          grep -q 'object-management.js?v=0.36.18.259' index.html
          grep -q 'object-selection-layout.js?v=0.36.18.259' index.html
          grep -q 'src/multi-object-transform.js?v=0.36.1.0' index.html
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/object-management.js src/object-selection-layout.js tests/object-selection-singleton-contract.test.mjs index.html version.json
          git commit -m 'Release BoxLab v0.36.18.259 single Object selection toolbar'
          git push
