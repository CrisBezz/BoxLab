name: BoxLab 241 Through auto-promote
on:
  push:
    paths:
      - '.github/workflows/boxlab-241-through-autopromote.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Through planner
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/through-kernel.js')
          s=p.read_text()
          old="""  const first=hits[0].min,depth=hits[0].max;
  // A stepped/nonparallel exit may require separate depths; reject instead of crossing a second shell.
  if(hits.some(h=>h.min>depth+eps*8))fail('multiple-exit-depths');
  const endDepth=Math.max(...hits.map(h=>h.max));
  return {source,n,dir,sides,start,eps,ts:ts.map(t=>t.p),first,depth:endDepth,fi};
"""
          new="""  const first=hits[0].min;
  // v241: a source face on/near an existing tunnel can legitimately see several
  // shell crossings along the same inward prism. Treat the whole connected closed
  // object as the Through target and use the farthest valid exit depth instead of
  // demoting/rejecting the gesture as an ordinary Extrude.
  const endDepth=Math.max(...hits.map(h=>h.max));
  return {source,n,dir,sides,start,eps,ts:ts.map(t=>t.p),first,depth:endDepth,fi,multiExit:hits.length>1};
"""
          if old not in s:
              raise SystemExit('through multi-exit marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('src/multi-face-direct.js')
          s=p.read_text()
          s=s.replace("./through-kernel.js?v=0.36.16.0","./through-kernel.js?v=0.36.18.241",1)
          s=s.replace("./topology-seam-conformance.js?v=0.36.18.240","./topology-seam-conformance.js?v=0.36.18.241",1)
          p.write_text(s)

          p=Path('src/release-version.js')
          s=p.read_text().replace("const VERSION='0.36.18.240';","const VERSION='0.36.18.241';")
          p.write_text(s)
          Path('version.json').write_text('{"version":"0.36.18.241"}\n')

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('BoxLab v0.36.18.240','BoxLab v0.36.18.241')
          s=s.replace('./src/multi-face-direct.js?v=0.36.18.240','./src/multi-face-direct.js?v=0.36.18.241')
          s=s.replace('./src/direct-topology-conformance-guard.js?v=0.36.18.240','./src/direct-topology-conformance-guard.js?v=0.36.18.241')
          s=s.replace('./src/release-version.js?v=0.36.18.240','./src/release-version.js?v=0.36.18.241')
          p.write_text(s)

          p=Path('src/direct-topology-conformance-guard.js')
          s=p.read_text().replace("const VERSION='0.36.18.240';","const VERSION='0.36.18.241';")
          p.write_text(s)
          PY
      - name: Commit 241
        run: |
          git config user.name 'Bezzo'
          git config user.email '115067958+CrisBezz@users.noreply.github.com'
          git add src/through-kernel.js src/multi-face-direct.js src/direct-topology-conformance-guard.js src/release-version.js version.json index.html
          git commit -m 'BoxLab 0.36.18.241 auto-promote tunnel Through'
          git push
