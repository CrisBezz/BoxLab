name: Release BoxLab 272
on:
  push:
    paths:
      - '.github/workflows/release-272.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply 272 balanced SubD bridge
        run: python .github/scripts/release-272.py
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Verify package and protected transform
        run: |
          grep -q 'BoxLab v0.36.18.272' index.html
          grep -q 'loose-bootstrap.js?v=0.36.18.272' index.html
          grep -q 'styles.css?v=0.36.18.270' index.html
          grep -q 'bridge-all-quad.js?v=0.36.18.272' src/loose-bootstrap.js
          grep -q '"version":"0.36.18.272"' version.json
          grep -q 'balancedDensification:true' src/bridge-all-quad.js
          test "$(git hash-object src/multi-object-transform.js)" = "0b6f676900bf9a3787cf420e276bbb0f57ac46ff"
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css index.html version.json src/bridge-all-quad.js src/loose-bootstrap.js tests/bridge-all-quad.test.mjs tests/selection-button-layout.test.mjs
          git commit -m 'Release BoxLab v0.36.18.272 balanced SubD bridge densification'
          git push
