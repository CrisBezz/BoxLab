name: Release BoxLab 273
on:
  push:
    paths:
      - '.github/workflows/release-273.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply 273 package
        run: python .github/scripts/release-273.py
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Verify package and protected transform
        run: |
          grep -q 'BoxLab v0.36.18.273' index.html
          grep -q 'loose-bootstrap.js?v=0.36.18.273' index.html
          grep -q 'styles.css?v=0.36.18.270' index.html
          grep -q 'bridge-open-chain-all-quad.js?v=0.36.18.273' src/loose-bootstrap.js
          grep -q '"version":"0.36.18.273"' version.json
          grep -q 'subdFriendly:true' src/bridge-open-chain-all-quad.js
          test "$(git hash-object src/multi-object-transform.js)" = "0b6f676900bf9a3787cf420e276bbb0f57ac46ff"
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.json
          git commit -m 'Release BoxLab v0.36.18.273 SubD-friendly open-chain Bridge'
          git push
