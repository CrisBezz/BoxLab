name: Release BoxLab 267
on:
  push:
    paths:
      - '.github/workflows/release-267.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply 267 selection patch
        run: python .github/scripts/release-267.py
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Verify package and protected transform
        run: |
          grep -q 'BoxLab v0.36.18.267' index.html
          grep -q 'main.js?v=0.36.18.267' index.html
          grep -q 'loose-bootstrap.js?v=0.36.18.267' index.html
          grep -q '"version":"0.36.18.267"' version.json
          test "$(git hash-object src/multi-object-transform.js)" = "0b6f676900bf9a3787cf420e276bbb0f57ac46ff"
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.js index.html version.json tests/unified-toggle-selection.test.mjs
          git commit -m 'Release BoxLab v0.36.18.267 unified toggle selection'
          git push
