name: Release BoxLab 261
on:
  push:
    paths:
      - '.github/workflows/release-261.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Package 0.36.18.261
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('BoxLab v0.36.18.260','BoxLab v0.36.18.261')
          s=s.replace('v0.36.18.260</span>','v0.36.18.261</span>')
          s=s.replace('./src/loose-bootstrap.js?v=0.36.18.254','./src/loose-bootstrap.js?v=0.36.18.261')
          p.write_text(s)
          Path('version.json').write_text('{"version":"0.36.18.261"}\n')
          assert 'BoxLab v0.36.18.261' in s
          assert 'loose-bootstrap.js?v=0.36.18.261' in s
          assert 'bridge-unequal-global.js?v=0.36.18.261' in Path('src/loose-bootstrap.js').read_text()
          PY
      - name: Verify protected transform unchanged
        run: |
          test "$(git hash-object src/multi-object-transform.js)" = "0b6f676900bf9a3787cf420e276bbb0f57ac46ff"
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.json
          git commit -m 'Release BoxLab v0.36.18.261'
          git push
