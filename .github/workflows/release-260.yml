name: Release 0.36.18.260

on:
  push:
    paths:
      - '.github/workflows/release-260.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Guard Object selection runtime singleton
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/object-management.js')
          s=p.read_text()
          old="function initialize(){if(!manager()||!drawer||!list)return false;buildToolbar();selectedIds=new Set(activeId()==null?[]:[activeId()]);installCaptureHandlers();installObserver();updateUI();globalThis.__boxlabObjectSelection={get ids(){return new Set(selectedIds);},get multi(){return multiEnabled;},select(ids=[]){multiEnabled=true;selectedIds=new Set(ids);updateUI();},clear(){selectedIds.clear();updateUI();}};installHistoryBridge();return true;}"
          new="function initialize(){if(globalThis.__boxlabObjectSelectionRuntime?.initialized)return true;if(!manager()||!drawer||!list)return false;globalThis.__boxlabObjectSelectionRuntime={initialized:true,owner:toolbarOwner};buildToolbar();selectedIds=new Set(activeId()==null?[]:[activeId()]);installCaptureHandlers();installObserver();updateUI();globalThis.__boxlabObjectSelection={__authoritative:true,owner:toolbarOwner,get ids(){return new Set(selectedIds);},get multi(){return multiEnabled;},select(ids=[]){multiEnabled=true;selectedIds=new Set(ids);updateUI();},clear(){selectedIds.clear();updateUI();}};installHistoryBridge();return true;}"
          if old not in s: raise SystemExit('initialize marker missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Add runtime singleton regression
        run: |
          cat > tests/object-selection-runtime-singleton.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const source=readFileSync(new URL('../src/object-management.js',import.meta.url),'utf8');
          test('Object selection runtime initializes only once across duplicate module URLs',()=>{
            assert.match(source,/__boxlabObjectSelectionRuntime\?\.initialized\)return true/);
            assert.match(source,/__boxlabObjectSelectionRuntime=\{initialized:true,owner:toolbarOwner\}/);
            assert.match(source,/__boxlabObjectSelection=\{__authoritative:true,owner:toolbarOwner/);
          });
          EOF
      - name: Update stale version contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['tests/object-selection-proxy-contract.test.mjs','src/object-selection-layout.js']:
            p=Path(name)
            if p.exists():
              s=p.read_text().replace('0.36.18.259','0.36.18.260').replace('0\\.36\\.18\\.259','0\\.36\\.18\\.260')
              p.write_text(s)
          PY
      - run: npm test
      - name: Package 0.36.18.260
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          s=re.sub(r'<title>BoxLab v[^<]+</title>','<title>BoxLab v0.36.18.260</title>',s,1)
          s=re.sub(r'<span id="appVersion">v[^<]+</span>','<span id="appVersion">v0.36.18.260</span>',s,1)
          s=re.sub(r'object-management\.js\?v=[^"<]+','object-management.js?v=0.36.18.260',s,1)
          s=re.sub(r'object-selection-layout\.js\?v=[^"<]+','object-selection-layout.js?v=0.36.18.260',s,1)
          p.write_text(s)
          Path('version.json').write_text('{"version":"0.36.18.260"}\n')
          PY
          grep -q 'object-management.js?v=0.36.18.260' index.html
          grep -q 'src/multi-object-transform.js?v=0.36.1.0' index.html
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/object-management.js src/object-selection-layout.js tests/object-selection-runtime-singleton.test.mjs tests/object-selection-proxy-contract.test.mjs index.html version.json
          git commit -m 'Release BoxLab v0.36.18.260 Object selection runtime singleton'
          git push
