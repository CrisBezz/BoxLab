name: Release BoxLab 265
on:
  push:
    paths:
      - '.github/workflows/release-265.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Package 0.36.18.265
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('BoxLab v0.36.18.264','BoxLab v0.36.18.265')
          s=s.replace('v0.36.18.264</span>','v0.36.18.265</span>')
          s=s.replace('./src/loose-bootstrap.js?v=0.36.18.264','./src/loose-bootstrap.js?v=0.36.18.265')
          p.write_text(s)
          Path('version.json').write_text('{"version":"0.36.18.265"}\n')
          assert 'BoxLab v0.36.18.265' in s
          assert 'loose-bootstrap.js?v=0.36.18.265' in s
          assert 'bridge-open-chain.js?v=0.36.18.265' in Path('src/loose-bootstrap.js').read_text()
          PY
      - name: Verify protected transform unchanged
        run: |
          test "$(git hash-object src/multi-object-transform.js)" = "0b6f676900bf9a3787cf420e276bbb0f57ac46ff"
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.json
          git commit -m 'Release BoxLab v0.36.18.265'
          git push
