name: Publish BoxLab 243

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boxlab-243-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache-hop live runtime to 243
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          replacements={
            '<title>BoxLab v0.36.18.242</title>':'<title>BoxLab v0.36.18.243</title>',
            '<span id="appVersion">v0.36.18.239</span>':'<span id="appVersion">v0.36.18.243</span>',
            './src/loose-bootstrap.js?v=0.36.11.1':'./src/loose-bootstrap.js?v=0.36.18.243',
          }
          for old,new in replacements.items():
            if old not in s: raise SystemExit(f'marker missing: {old}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Release BoxLab v0.36.18.243 transactional Bridge'
          git push
