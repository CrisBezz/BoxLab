name: Release BoxLab 274
# rerun after broadening explicit fallback regression reasons
on:
  push:
    paths:
      - '.github/workflows/release-274.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply 274 open-chain quality guard
        run: |
          python .github/scripts/release-274.py
          python .github/scripts/release-274-fix.py
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Package 274
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          s=re.sub(r'BoxLab v0\.36\.18\.\d+','BoxLab v0.36.18.274',s,count=1)
          s=re.sub(r'(<span id="appVersion">v0\.36\.18\.)\d+(</span>)',r'\g<1>274\2',s,count=1)
          s=re.sub(r'(src="\./src/loose-bootstrap\.js\?v=0\.36\.18\.)\d+(")',r'\g<1>274\2',s,count=1)
          s=re.sub(r'(href="\./styles\.css\?v=0\.36\.18\.)\d+(")',r'\g<1>270\2',s,count=1)
          p.write_text(s)
          Path('version.json').write_text('{"version":"0.36.18.274"}\n')
          PY
      - name: Verify package and protected transform
        run: |
          grep -q 'BoxLab v0.36.18.274' index.html
          grep -q 'loose-bootstrap.js?v=0.36.18.274' index.html
          grep -q 'styles.css?v=0.36.18.270' index.html
          grep -q 'bridge-open-chain-all-quad.js?v=0.36.18.274' src/loose-bootstrap.js
          grep -q 'validateOpenAllQuadCandidate' src/bridge-open-chain-all-quad.js
          grep -q 'lastReject' src/bridge-open-chain-all-quad.js
          grep -q '"version":"0.36.18.274"' version.json
          test "$(git hash-object src/multi-object-transform.js)" = "0b6f676900bf9a3787cf420e276bbb0f57ac46ff"
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bridge-open-chain-all-quad.js src/loose-bootstrap.js tests/bridge-open-chain-all-quad.test.mjs index.html version.json
          git commit -m 'Release BoxLab v0.36.18.274 open-chain quality guard'
          git push
