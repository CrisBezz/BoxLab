name: BoxLab 239 shell cache hop
on:
  push:
    paths:
      - '.github/workflows/boxlab-cachehop-239.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch 239 shell
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<title>BoxLab v0.36.18.238</title>','<title>BoxLab v0.36.18.239</title>')
          s=s.replace('<span id="appVersion">v0.36.18.238</span>','<span id="appVersion">v0.36.18.239</span>')
          s=s.replace('./src/direct-topology-conformance-guard.js?v=0.36.18.238','./src/direct-topology-conformance-guard.js?v=0.36.18.239')
          s=s.replace('./src/release-version.js?v=0.36.18.238','./src/release-version.js?v=0.36.18.239')
          p.write_text(s)
          PY
      - name: Commit shell hop
        run: |
          git config user.name 'Bezzo'
          git config user.email '115067958+CrisBezz@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'BoxLab 0.36.18.239 shell cache hop [skip ci]'
          git push
