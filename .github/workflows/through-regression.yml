name: Topology regression

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '*.css'
      - 'index.html'
      - 'version.json'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'package*.json'
      - '.github/workflows/through-regression.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '*.css'
      - 'index.html'
      - 'version.json'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'package*.json'
      - '.github/workflows/through-regression.yml'

permissions:
  contents: read

jobs:
  topology-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Run subdivision comparison in headless browser
        run: npm run benchmark:subdivision:headless -- --output "benchmark-artifacts/subdivision-wasm-${{ github.run_id }}.json"
      - name: Upload subdivision comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subdivision-wasm-headless-${{ github.run_id }}
          path: benchmark-artifacts/subdivision-wasm-${{ github.run_id }}.json
          if-no-files-found: warn
