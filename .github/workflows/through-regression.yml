name: Topology regression

on:
  push:
    branches: [main]
    paths:
      - 'src/through-kernel.js'
      - 'src/multi-face-direct.js'
      - 'src/topology-foundation.js'
      - 'src/topology-seam-conformance.js'
      - 'src/bridge-topology.js'
      - 'src/bridge-transactional.js'
      - 'src/bridge-unequal.js'
      - 'src/bridge-unequal-quality.js'
      - 'src/bridge-ui.js'
      - 'src/loose-bootstrap.js'
      - 'src/mesh.js'
      - 'src/history.js'
      - 'tests/**'
      - 'package.json'
      - 'index.html'
      - '.github/workflows/through-regression.yml'
  pull_request:
    paths:
      - 'src/through-kernel.js'
      - 'src/multi-face-direct.js'
      - 'src/topology-foundation.js'
      - 'src/topology-seam-conformance.js'
      - 'src/bridge-topology.js'
      - 'src/bridge-transactional.js'
      - 'src/bridge-unequal.js'
      - 'src/bridge-unequal-quality.js'
      - 'src/bridge-ui.js'
      - 'src/loose-bootstrap.js'
      - 'src/mesh.js'
      - 'src/history.js'
      - 'tests/**'
      - 'package.json'
      - 'index.html'
      - '.github/workflows/through-regression.yml'

permissions:
  contents: read

jobs:
  topology-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
