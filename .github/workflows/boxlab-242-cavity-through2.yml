name: BoxLab 242 cavity Through retry
on:
  push:
    paths:
      - '.github/workflows/boxlab-242-cavity-through2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        env:
          PATCH_B64: " "
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          git config user.name 'Bezzo'
          git config user.email '115067958+CrisBezz@users.noreply.github.com'
          git add src/through-kernel.js src/multi-face-direct.js src/direct-topology-conformance-guard.js src/release-version.js version.json index.html
          git commit -m 'BoxLab 0.36.18.242 cavity-aware Through targets'
          git push