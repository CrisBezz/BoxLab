name: BoxLab 240 direct commit patch
on:
  push:
    paths:
      - '.github/workflows/boxlab-240-direct-commit.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 240 direct Extrude gate
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          git config user.name 'Bezzo'
          git config user.email '115067958+CrisBezz@users.noreply.github.com'
          git add src/multi-face-direct.js src/direct-topology-conformance-guard.js src/release-version.js version.json index.html
          git commit -m 'BoxLab 0.36.18.240 gate ordinary Extrude commit'
          git push