name: Release 0.36.18.249

on:
  push:
    paths:
      - '.github/workflows/release-249.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Package 0.36.18.249
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/direct-bevel.js')
          s=p.read_text()
          s=s.replace("import './transform-arming.js?v=0.32.14';", "import './transform-arming.js?v=0.36.18.249';")
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<title>BoxLab v0.36.18.248</title>','<title>BoxLab v0.36.18.249</title>')
          s=s.replace('<span id="appVersion">v0.36.18.248</span>','<span id="appVersion">v0.36.18.249</span>')
          s=re.sub(r'direct-bevel\.js\?v=[^"<]+','direct-bevel.js?v=0.36.18.249',s)
          p.write_text(s)
          PY
          printf '{"version":"0.36.18.249"}\n' > version.json
          grep -q "transform-arming.js?v=0.36.18.249" src/direct-bevel.js
          grep -q 'direct-bevel.js?v=0.36.18.249' index.html
          grep -q '<title>BoxLab v0.36.18.249</title>' index.html
          grep -q '"version":"0.36.18.249"' version.json
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/direct-bevel.js index.html version.json
          git commit -m 'Release BoxLab v0.36.18.249'
          git push
