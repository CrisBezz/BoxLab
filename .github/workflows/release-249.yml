name: Release 0.36.18.249

on:
  push:
    paths:
      - '.github/workflows/release-249.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Bump release and cache-hop transform arming
        run: |
          python -c "from pathlib import Path; import re; p=Path('index.html'); s=p.read_text(); s=s.replace('<title>BoxLab v0.36.18.248</title>','<title>BoxLab v0.36.18.249</title>').replace('<span id=\"appVersion\">v0.36.18.248</span>','<span id=\"appVersion\">v0.36.18.249</span>'); s=re.sub(r'(src=\"\\./src/transform-arming\\.js\\?v=)[^\"]+',r'\\g<1>0.36.18.249',s); p.write_text(s)"
          printf '{"version":"0.36.18.249"}\n' > version.json
          grep -q 'transform-arming.js?v=0.36.18.249' index.html
          grep -q '<title>BoxLab v0.36.18.249</title>' index.html
          grep -q '"version":"0.36.18.249"' version.json
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.json
          git commit -m 'Release BoxLab v0.36.18.249'
          git push
