name: Release 0.36.18.249

on:
  push:
    paths:
      - '.github/workflows/release-249.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trace transform arming loader
        run: |
          grep -R -n --exclude-dir=.git 'transform-arming' . || true
          grep -R -n --exclude-dir=.git '__boxlabTransformArming' src index.html || true
          exit 1
