name: Publish BoxLab 248

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boxlab-248-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/publish-248.py
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/boolean-bsp.js src/boolean-prototype.js index.html version.json
          git commit -m 'Release BoxLab v0.36.18.248 Boolean planar seam repair'
          git push
