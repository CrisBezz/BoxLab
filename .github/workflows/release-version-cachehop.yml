name: Release version cache-hop

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-version-cachehop.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache-hop release version owner
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='./src/release-version.js?v=0.36.18.242'
          new='./src/release-version.js?v=0.36.18.246.1'
          if old not in s: raise SystemExit(f'marker missing: {old}')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Cache-hop dynamic release version owner'
          git push
