name: Release 0.36.18.258

on:
  push:
    paths:
      - '.github/workflows/release-258.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Make Selection drawer the native Object toolbar host
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/object-management.js')
          s=p.read_text()
          old="drawer.insertBefore(toolbar,list||drawer.firstChild);"
          new="const selectionHost=document.querySelector('#selectionDrawer');(selectionHost||drawer).appendChild(toolbar);"
          if old not in s:
            raise SystemExit('native toolbar insertion marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Replace proxy layout with native-toolbar layout
        run: |
          cat > src/object-selection-layout.js <<'EOF'
          // BoxLab v0.36.18.258 — native Object selection toolbar lives in Selection.
          const VERSION='0.36.18.258';
          const selectionDrawer=document.querySelector('#selectionDrawer');
          const componentTools=document.querySelector('#componentSelectionTools');
          const title=document.querySelector('#selectionDrawer .always-selection-title');

          function currentMode(){return document.querySelector('#selectionModes button.active')?.dataset?.mode||'face';}
          function toolbar(){return selectionDrawer?.querySelector('#objectManagementTools,.object-management-tools')||null;}
          function installStyle(){
            if(document.querySelector('#boxlabObjectSelectionLayoutStyle'))return;
            const style=document.createElement('style');
            style.id='boxlabObjectSelectionLayoutStyle';
            style.textContent=`
          #selectionDrawer #objectManagementTools,#selectionDrawer .object-management-tools{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:5px!important;margin:0!important;padding:0!important}
          #selectionDrawer #objectManagementTools button,#selectionDrawer .object-management-tools button{min-width:0!important;width:100%!important;padding:5px 5px!important;font-size:10px!important}
          #selectionDrawer #objectManagementTools .object-management-count,#selectionDrawer .object-management-tools .object-management-count{grid-column:1/-1!important;padding:1px 1px 0!important;margin:0!important;font-size:10px!important;opacity:.62!important}
          #selectionDrawer.object-selection-active #componentSelectionTools{display:none!important}
          #selectionDrawer:not(.object-selection-active) #objectManagementTools,#selectionDrawer:not(.object-selection-active) .object-management-tools{display:none!important}
          `;
            document.head.appendChild(style);
          }
          function sync(){
            installStyle();
            const objectMode=currentMode()==='object';
            selectionDrawer?.classList.toggle('object-selection-active',objectMode);
            if(title)title.textContent=objectMode?'Selection • Object':'Selection';
            if(componentTools)componentTools.setAttribute('aria-hidden',objectMode?'true':'false');
            return !!toolbar();
          }
          function schedule(){[0,20,60,160,400,900].forEach(delay=>setTimeout(sync,delay));}
          schedule();
          window.addEventListener('boxlab-object-manager-ready',schedule);
          window.addEventListener('boxlab-bridge-state',()=>setTimeout(sync,0));
          document.querySelectorAll('#selectionModes button').forEach(button=>button.addEventListener('click',()=>queueMicrotask(sync)));
          globalThis.__boxlabObjectSelectionLayout={version:VERSION,sync,toolbar};
          EOF
      - name: Add native ownership regression
        run: |
          cat > tests/object-selection-proxy-contract.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const layout=readFileSync(new URL('../src/object-selection-layout.js',import.meta.url),'utf8');
          const management=readFileSync(new URL('../src/object-management.js',import.meta.url),'utf8');
          test('Object management creates the real toolbar in Selection',()=>{
            assert.match(management,/selectionHost=document\.querySelector\('#selectionDrawer'\)/);
            assert.match(management,/\(selectionHost\|\|drawer\)\.appendChild\(toolbar\)/);
          });
          test('Selection layout has no proxy or toolbar relocation machinery',()=>{
            assert.match(layout,/0\.36\.18\.258/);
            assert.doesNotMatch(layout,/objectSelectionProxyTools/);
            assert.doesNotMatch(layout,/MutationObserver/);
            assert.doesNotMatch(layout,/\.click\(\)/);
            assert.match(layout,/object-selection-active/);
          });
          EOF
          rm -f tests/object-selection-layout-contract.test.mjs
      - run: npm test
      - name: Package 0.36.18.258
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          s=re.sub(r'<title>BoxLab v[^<]+</title>','<title>BoxLab v0.36.18.258</title>',s,1)
          s=re.sub(r'<span id="appVersion">v[^<]+</span>','<span id="appVersion">v0.36.18.258</span>',s,1)
          s=re.sub(r'object-management\.js\?v=[^"<]+','object-management.js?v=0.36.18.258',s,1)
          s=re.sub(r'object-selection-layout\.js\?v=[^"<]+','object-selection-layout.js?v=0.36.18.258',s,1)
          p.write_text(s)
          Path('version.json').write_text('{"version":"0.36.18.258"}\n')
          PY
          grep -q 'object-management.js?v=0.36.18.258' index.html
          grep -q 'object-selection-layout.js?v=0.36.18.258' index.html
          grep -q 'src/multi-object-transform.js?v=0.36.1.0' index.html
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/object-management.js src/object-selection-layout.js tests/object-selection-proxy-contract.test.mjs tests/object-selection-layout-contract.test.mjs index.html version.json
          git commit -m 'Release BoxLab v0.36.18.258 native Object selection toolbar'
          git push
