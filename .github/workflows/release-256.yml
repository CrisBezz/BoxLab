name: Release 0.36.18.256

on:
  push:
    paths:
      - '.github/workflows/release-256.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Patch reliable Object Multi viewport picking
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/multi-object.js')
          s=p.read_text()
          old="""function handleViewportActivation(event, stopEvent = true) {
  const camera = state()?.camera;
  if (currentMode() === 'object' && inactiveBodies.length && camera) {
    setPointer(event);
    raycaster.setFromCamera(pointer, camera);
    const activeHit = activeBody?.visible ? raycaster.intersectObject(activeBody, false)[0] : null;
    const inactiveHit = raycaster.intersectObjects(inactiveBodies.filter(body => body.visible), false)[0];
    const inactiveIsCloser = inactiveHit && (!activeHit || inactiveHit.distance < activeHit.distance - OBJECT_HIT_EPSILON);
    if (inactiveIsCloser) {
      if (stopEvent) {
        event.preventDefault();
        event.stopImmediatePropagation();
      }
      const id = Number(inactiveHit.object.userData.objectId);
      const objectSelection = globalThis.__boxlabObjectSelection;
      if (objectSelection?.multi) {
        const ids = objectSelection.ids;
        ids.has(id) ? ids.delete(id) : ids.add(id);
        objectSelection.select([...ids]);
        const object = objects.find(item => item.id === id);
        if (status) status.textContent = `${object?.name || 'Object'} ${ids.has(id) ? 'added to' : 'removed from'} Multi selection`;
      } else {
        activateObject(id);
      }
      return true;
    }
  }
"""
          new="""function handleViewportActivation(event, stopEvent = true) {
  const camera = state()?.camera;
  if (currentMode() === 'object' && camera) {
    setPointer(event);
    raycaster.setFromCamera(pointer, camera);
    const objectSelection = globalThis.__boxlabObjectSelection;

    if (objectSelection?.multi) {
      const hits = [];
      if (activeBody?.visible) {
        const hit = raycaster.intersectObject(activeBody, false)[0];
        if (hit) hits.push({ ...hit, objectId:activeId });
      }
      for (const body of inactiveBodies.filter(body => body.visible)) {
        const hit = raycaster.intersectObject(body, false)[0];
        if (hit) hits.push({ ...hit, objectId:Number(body.userData.objectId) });
      }
      hits.sort((a,b) => a.distance - b.distance);
      const nearest = hits[0];
      if (nearest && Number.isFinite(nearest.objectId)) {
        if (stopEvent) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
        const id = nearest.objectId;
        const ids = objectSelection.ids;
        ids.has(id) ? ids.delete(id) : ids.add(id);
        objectSelection.select([...ids]);
        const object = objects.find(item => item.id === id);
        if (status) status.textContent = `${object?.name || 'Object'} ${ids.has(id) ? 'added to' : 'removed from'} Multi selection`;
        return true;
      }
    }

    if (inactiveBodies.length) {
      const activeHit = activeBody?.visible ? raycaster.intersectObject(activeBody, false)[0] : null;
      const inactiveHit = raycaster.intersectObjects(inactiveBodies.filter(body => body.visible), false)[0];
      const inactiveIsCloser = inactiveHit && (!activeHit || inactiveHit.distance < activeHit.distance - OBJECT_HIT_EPSILON);
      if (inactiveIsCloser) {
        if (stopEvent) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
        const id = Number(inactiveHit.object.userData.objectId);
        activateObject(id);
        return true;
      }
    }
  }
"""
          if old not in s:
            raise SystemExit('Expected viewport activation block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Add regression contract
        run: |
          cat > tests/object-multi-picking-contract.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const source=readFileSync(new URL('../src/multi-object.js',import.meta.url),'utf8');
          test('Object Multi picking raycasts active and inactive objects',()=>{
            assert.match(source,/if \(objectSelection\?\.multi\)/);
            assert.match(source,/objectId:activeId/);
            assert.match(source,/objectId:Number\(body\.userData\.objectId\)/);
            assert.match(source,/hits\.sort\(\(a,b\) => a\.distance - b\.distance\)/);
            assert.match(source,/objectSelection\.select\(\[\.\.\.ids\]\)/);
          });
          test('single-object activation path remains separate',()=>{
            assert.match(source,/if \(inactiveBodies\.length\)/);
            assert.match(source,/activateObject\(id\)/);
          });
          EOF
      - run: npm test
      - name: Package 0.36.18.256
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          s=re.sub(r'<title>BoxLab v[^<]+</title>','<title>BoxLab v0.36.18.256</title>',s,1)
          s=re.sub(r'<span id="appVersion">v[^<]+</span>','<span id="appVersion">v0.36.18.256</span>',s,1)
          s=re.sub(r'multi-object\.js\?v=[^"<]+','multi-object.js?v=0.36.18.256',s,1)
          p.write_text(s)
          Path('version.json').write_text('{"version":"0.36.18.256"}\n')
          PY
          grep -q 'multi-object.js?v=0.36.18.256' index.html
          grep -q 'src/multi-object-transform.js?v=0.36.1.0' index.html
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/multi-object.js tests/object-multi-picking-contract.test.mjs index.html version.json
          git commit -m 'Release BoxLab v0.36.18.256 reliable Object Multi picking'
          git push
