name: Release 0.36.18.256

on:
  push:
    paths:
      - '.github/workflows/release-256.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Patch Object selection API
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/object-management.js')
          s=p.read_text()
          marker="updateRows();syncGroupControls(chosen);}"
          if marker not in s:
            raise SystemExit('updateUI marker missing')
          s=s.replace(marker,"updateRows();syncGroupControls(chosen);window.dispatchEvent(new Event('boxlab-object-selection-change'));}",1)
          old="globalThis.__boxlabObjectSelection={get ids(){return new Set(selectedIds);},get multi(){return multiEnabled;},select(ids=[]){multiEnabled=true;selectedIds=new Set(ids);updateUI();},clear(){selectedIds.clear();updateUI();}};"
          new="""globalThis.__boxlabObjectSelection={
get ids(){return new Set(selectedIds);},
get multi(){return multiEnabled;},
get count(){return selectedObjects().length;},
get total(){return objects().length;},
get allSelected(){const all=objects();return !!all.length&&all.every(o=>selectedIds.has(o.id));},
get allHidden(){const chosen=selectedObjects();return !!chosen.length&&chosen.every(o=>!o.visible);},
get allLocked(){const chosen=selectedObjects();return !!chosen.length&&chosen.every(o=>o.locked);},
select(ids=[]){multiEnabled=true;selectedIds=new Set(ids);updateUI();},
toggleMulti(){multiEnabled=!multiEnabled;selectedIds.clear();if(multiEnabled&&activeId()!=null)selectedIds.add(activeId());updateUI();},
toggleAll(){multiEnabled=true;const all=objects(),every=all.length&&all.every(o=>selectedIds.has(o.id));selectedIds=every?new Set():new Set(all.map(o=>o.id));updateUI();},
toggleVisibility(){const chosen=selectedObjects();if(!chosen.length)return;const hide=chosen.some(o=>o.visible);for(const o of chosen)o.visible=!hide;forceRender();updateUI();},
toggleLock(){const chosen=selectedObjects();if(!chosen.length)return;const lock=chosen.some(o=>!o.locked);for(const o of chosen)o.locked=lock;if(lock&&chosen.some(o=>o.id===activeId()))document.querySelector('#toolModes button[data-tool=\"move\"]')?.click();setStatus(`${chosen.length} object${chosen.length===1?'':'s'} ${lock?'locked':'unlocked'}`);forceRender();updateUI();},
clear(){selectedIds.clear();if(!multiEnabled&&activeId()!=null)selectedIds.add(activeId());updateUI();}
};"""
          if old not in s:
            raise SystemExit('selection API marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Patch reliable Object Multi viewport picking
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/multi-object.js')
          s=p.read_text()
          start=s.index('function handleViewportActivation(event, stopEvent = true) {')
          end=s.index('\nfunction installViewportActivation()',start)
          old=s[start:end]
          new="""function handleViewportActivation(event, stopEvent = true) {
  const camera = state()?.camera;
  if (currentMode() === 'object' && camera) {
    setPointer(event);
    raycaster.setFromCamera(pointer, camera);
    const objectSelection = globalThis.__boxlabObjectSelection;

    if (objectSelection?.multi) {
      const hits = [];
      if (activeBody?.visible) {
        const hit = raycaster.intersectObject(activeBody, false)[0];
        if (hit) hits.push({ distance:hit.distance, objectId:activeId });
      }
      for (const body of inactiveBodies.filter(body => body.visible)) {
        const hit = raycaster.intersectObject(body, false)[0];
        if (hit) hits.push({ distance:hit.distance, objectId:Number(body.userData.objectId) });
      }
      hits.sort((a,b) => a.distance - b.distance);
      const nearest = hits[0];
      if (nearest && Number.isFinite(nearest.objectId)) {
        if (stopEvent) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
        const id = nearest.objectId;
        const ids = objectSelection.ids;
        ids.has(id) ? ids.delete(id) : ids.add(id);
        objectSelection.select([...ids]);
        const object = objects.find(item => item.id === id);
        if (status) status.textContent = `${object?.name || 'Object'} ${ids.has(id) ? 'added to' : 'removed from'} Multi selection`;
        return true;
      }
    }

    if (inactiveBodies.length) {
      const activeHit = activeBody?.visible ? raycaster.intersectObject(activeBody, false)[0] : null;
      const inactiveHit = raycaster.intersectObjects(inactiveBodies.filter(body => body.visible), false)[0];
      const inactiveIsCloser = inactiveHit && (!activeHit || inactiveHit.distance < activeHit.distance - OBJECT_HIT_EPSILON);
      if (inactiveIsCloser) {
        if (stopEvent) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
        const id = Number(inactiveHit.object.userData.objectId);
        activateObject(id);
        return true;
      }
    }
  }
  const active = activeObject();
  if (active?.locked && activeBody && hitObject(event, activeBody)) {
    if (stopEvent) {
      event.preventDefault();
      event.stopImmediatePropagation();
    }
    if (status) status.textContent = `${active.name} is locked • unlock it in the Outliner to edit`;
    return true;
  }
  return false;
}"""
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
      - name: Add Object selection regression contracts
        run: |
          cat > tests/object-selection-proxy-contract.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const layout=readFileSync(new URL('../src/object-selection-layout.js',import.meta.url),'utf8');
          const management=readFileSync(new URL('../src/object-management.js',import.meta.url),'utf8');
          const multi=readFileSync(new URL('../src/multi-object.js',import.meta.url),'utf8');
          test('Selection drawer uses proxy controls instead of moving native toolbar',()=>{
            assert.match(layout,/objectSelectionProxyTools/);
            assert.match(layout,/objectApi\.toggleMulti\?\.\(\)/);
            assert.match(layout,/#objectsDrawer #objectManagementTools/);
            assert.doesNotMatch(layout,/appendChild\(t\)/);
          });
          test('Object selection API exposes proxy actions and state',()=>{
            for(const token of ['toggleMulti()','toggleAll()','toggleVisibility()','toggleLock()','get count()','get total()']) assert.ok(management.includes(token));
            assert.match(management,/boxlab-object-selection-change/);
          });
          test('Multi viewport picker considers active and inactive visible objects',()=>{
            assert.match(multi,/objectSelection\?\.multi/);
            assert.match(multi,/objectId:activeId/);
            assert.match(multi,/objectId:Number\(body\.userData\.objectId\)/);
            assert.match(multi,/hits\.sort\(\(a,b\) => a\.distance - b\.distance\)/);
          });
          EOF
          rm -f tests/object-selection-layout-contract.test.mjs
      - run: npm test
      - name: Package 0.36.18.256
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          s=re.sub(r'<title>BoxLab v[^<]+</title>','<title>BoxLab v0.36.18.256</title>',s,1)
          s=re.sub(r'<span id="appVersion">v[^<]+</span>','<span id="appVersion">v0.36.18.256</span>',s,1)
          for name in ['object-selection-layout','object-management','multi-object']:
            s=re.sub(rf'{name}\.js\?v=[^\"<]+',f'{name}.js?v=0.36.18.256',s,1)
          p.write_text(s)
          Path('version.json').write_text('{"version":"0.36.18.256"}\n')
          PY
          grep -q 'object-selection-layout.js?v=0.36.18.256' index.html
          grep -q 'object-management.js?v=0.36.18.256' index.html
          grep -q 'multi-object.js?v=0.36.18.256' index.html
          grep -q 'src/multi-object-transform.js?v=0.36.1.0' index.html
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/object-selection-layout.js src/object-management.js src/multi-object.js tests/object-selection-proxy-contract.test.mjs tests/object-selection-layout-contract.test.mjs index.html version.json
          git commit -m 'Release BoxLab v0.36.18.256 Object selection proxy controls'
          git push
