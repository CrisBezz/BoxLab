<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BoxLab .1070 image import check</title>
<style>body{font:16px system-ui;background:#111318;color:#eee;margin:24px}button{font:inherit;padding:12px}pre{white-space:pre-wrap}canvas{width:256px;max-width:90vw}</style>
<h1>Image import resize · .1070</h1>
<p>Isolated browser check of the production importer. Generated PNG/JPEG samples only; does not modify the open BoxLab project.</p>
<button id="run">Check PNG, JPEG and small images</button><pre id="report">Ready.</pre>
<script type="module">
import {importResizedPaintImage} from '../src/paint-image-source.js?v=0.36.18.1070';
const report=document.querySelector('#report'),button=document.querySelector('#run');
const encode=(canvas,type)=>new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('Encoding failed')),type,.92));
button.onclick=async()=>{
 button.disabled=true;const lines=[];
 try{
  for(const [width,height,type]of [[2048,1024,'image/png'],[1200,2400,'image/png'],[4032,3024,'image/jpeg'],[64,32,'image/png']]){
   const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d');
   ctx.fillStyle='rgba(240,40,20,.5)';ctx.fillRect(0,0,width,height/2);ctx.fillStyle='rgb(20,40,240)';ctx.fillRect(0,height/2,width,height/2);
   const bytes=new Uint8Array(await (await encode(canvas,type)).arrayBuffer()),source=await importResizedPaintImage(bytes);
   const ratio=Math.min(1,1024/Math.max(width,height)),expected=[Math.max(1,Math.round(width*ratio)),Math.max(1,Math.round(height*ratio))];
   if(source.width!==expected[0]||source.height!==expected[1])throw Error('Wrong dimensions');
   const top=(Math.floor(source.height/4)*source.width+Math.floor(source.width/2))*4,bottom=(Math.floor(source.height*.75)*source.width+Math.floor(source.width/2))*4;
   if(source.pixels[top]<=source.pixels[top+2]||source.pixels[bottom+2]<=source.pixels[bottom])throw Error('Orientation changed');
   if(type==='image/png'&&Math.abs(source.pixels[top+3]-128)>1)throw Error('PNG alpha changed');
   if(width<=1024&&height<=1024&&(bytes.length!==source.encoded.length||bytes.some((v,i)=>v!==source.encoded[i])))throw Error('Small source changed');
   // Reopening the stored normalized source must decode to the same editable cache.
   const reopened=await importResizedPaintImage(source.encoded);if(reopened.pixels.some((v,i)=>v!==source.pixels[i]))throw Error('Stored pixels differ');
   lines.push(`PASS ${type}: ${width} × ${height} → ${source.width} × ${source.height}; rows, alpha and stored pixels checked`);canvas.width=canvas.height=1;
  }
  report.textContent='4 / 4 PASS\n'+lines.join('\n');
 }catch(error){report.textContent=lines.join('\n')+'\nFAIL: '+error.message;}finally{button.disabled=false;}
};
</script>
